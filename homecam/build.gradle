plugins {
    id 'com.android.application'
}

// Release signing comes from CI secrets (see homecam/README.md). Without them the
// APK is signed with the debug key so it still installs, but updates may not.
def ksPath = System.getenv('HOMECAM_KEYSTORE')

android {
    namespace 'digital.blacktech.homecam'
    compileSdk 34

    defaultConfig {
        applicationId 'digital.blacktech.homecam'
        minSdk 26
        targetSdk 34
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('HOMECAM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HOMECAM_KEY_ALIAS')
                keyPassword System.getenv('HOMECAM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}

// kotlin-stdlib 1.8+ already contains the old -jdk7/-jdk8 split; drop the stale copies.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
